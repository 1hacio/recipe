server:
  port: 8080
  address: 0.0.0.0   #✅ 모든 로컬 접속 허용

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/recipe_db
    username: root
    password: "1234"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true

  application:
    name: recipick-backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: example-google-client-id
            client-secret: example-secret
            redirect-uri: http://localhost:5173/callback
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

openai:
  model: gpt-4o
  secret-key: dummy

