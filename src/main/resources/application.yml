server:
  port: 8080
  address: 0.0.0.0   #모든 로컬 접속 허용

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/recipick
    username: root
    password: "1234"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true

  application:
    name: recipick-backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

